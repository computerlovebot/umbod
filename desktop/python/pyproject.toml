[project]
name = "umbod-desktop"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["umbod-core", "keyring>=25.6.0"]

[project.scripts]
umbod-desktop = "umbod_desktop.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv.sources]
umbod-core = { path = "../../umbod/api", editable = true }
umbod = { path = "../../packages/umbod-sdk" }

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1", "ruff>=0.15"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
